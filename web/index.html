<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Driving Simulation</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="renderer.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>RL Driving Simulation</h1>
  <span id="status" class="status">idle</span>
</header>

<section class="controls" aria-label="Training controls">
  <div class="field">
    <label for="algo">Algorithm</label>
    <select id="algo"></select>
  </div>
  <div class="field">
    <label for="episodes">Episodes</label>
    <input id="episodes" type="number" min="1" max="200000" step="500" value="5000">
  </div>
  <div class="field">
    <label for="seed">Seed</label>
    <input id="seed" type="number" min="0" max="9999" value="0">
  </div>
  <div class="field">
    <label for="evalEvery">Evaluate every</label>
    <input id="evalEvery" type="number" min="0" max="10000" step="50" value="250">
  </div>
  <div id="hyper" class="hyper"></div>
  <div class="actions">
    <button id="train" class="primary">Train</button>
    <button id="stop" disabled>Stop</button>
  </div>
</section>

<main>
  <section class="panel viz">
    <div class="panel-head">
      <h2>Road</h2>
      <div class="playback">
        <button id="watchAgent" disabled>Watch agent</button>
        <button id="watchScripted">Watch scripted</button>
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="1" max="60" value="20">
      </div>
    </div>
    <canvas id="road" width="1000" height="260"></canvas>
    <p id="episodeInfo" class="episode-info">No episode loaded. Train an agent, or watch the
      hand-written driver for comparison.</p>
  </section>

  <section class="panel charts">
    <div class="panel-head"><h2>Learning</h2></div>
    <div class="chart"><canvas id="returnChart"></canvas></div>
    <div class="chart"><canvas id="collisionChart"></canvas></div>
    <table id="summary" class="summary">
      <caption>Latest greedy evaluation</caption>
      <tbody></tbody>
    </table>
  </section>
</main>
</body>
</html>
